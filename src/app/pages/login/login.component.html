<div class="form-word">
  <h1 class="form-word" style="text-align: center">
    COPYRIGHT SOCIETY OF ZANZIBAR
  </h1>

  <div class="container">
    <mat-card class="form-container">
      <h2 class="form-title">LOGIN</h2>
      <form
        [formGroup]="form"
        (ngSubmit)="f.form.valid && login()"
        #f="ngForm"
        novalidate
      >
        <div style="text-align: center">
          <img src="assets/img/photos/logo.jpg" class="login-logo" />
        </div>

        <div>
          <mat-form-field
            class="form-group"
            appearance="outline"
            style="width: 100%"
          >
            <mat-label for="email">Email:</mat-label>
            <input
              matInput
              type="email"
              id="email"
              formControlName="email"
              required
            />
          </mat-form-field>
        </div>

        <div>
          <mat-form-field
            class="form-group"
            appearance="outline"
            style="width: 100%"
          >
            <mat-label for="password">Password:</mat-label>
            <input
              matInput
              type="text"
              id="password"
              formControlName="password"
              required
            />
          </mat-form-field>
        </div>
        <button
          mat-raised-button
          type="submit"
          style="background-color: #009688; color: #fff; width: 100%"
          class="btn"
        >
          <span class="fa fa-sign-in"></span>
          Login
        </button>
      </form>
      <div style="text-align: center; margin-top: 15px;">
        <p>Already registered?</p>
        <button mat-raised-button style="background-color: #607D8B; color: #fff; width: 100%" (click)="onRegister()">
          Register
        </button>
      </div>
    </mat-card>
  </div>
</div>
