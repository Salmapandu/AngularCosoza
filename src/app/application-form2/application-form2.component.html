<body>
    <div class="container">
        <h3>Tick with "x" in the appropriate box</h3>

        <div class="checkbox-container">
            <div class="checkbox-group">
                <label>Activities of Establishment:</label>
                <div class="checkbox-item">
                    <input type="checkbox" id="radio_station"><label for="radio_station"> Radio Station</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="tv_station"><label for="tv_station"> Television Station</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="hotel"><label for="hotel"> Hotel</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="inn"><label for="inn"> Inn</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="motel"><label for="motel"> Motel</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="resthouse"><label for="resthouse"> Rest-house</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="restaurant"><label for="restaurant"> Restaurant</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="bar"><label for="bar"> Bar</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="bottle_store"><label for="bottle_store"> Bottle store</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="supermarket"><label for="supermarket"> Supermarket</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="shop"><label for="shop"> Shop/Store</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="tavern"><label for="tavern"> Tavern</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="discotheque"><label for="discotheque"> Discotheque</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="entertainment_hall"><label for="entertainment_hall"> Entertainment Hall/Recreation</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="saloon"><label for="saloon"> Saloon</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="bus_minibus"><label for="bus_minibus"> Bus and Minibus</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="taxi_operator"><label for="taxi_operator"> Taxi Operator</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="car_hire_operator"><label for="car_hire_operator"> Car Hire Operator</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="other_activities"><label for="other_activities"> Other (Specify)</label>
                </div>
            </div>

            <div class="checkbox-group">
                <label>Music Device Used:</label>
                <div class="checkbox-item">
                    <input type="checkbox" id="radio"><label for="radio"> Radio</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="radio_cassette"><label for="radio_cassette"> Radio Cassette</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="record_player"><label for="record_player"> Record Player</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="music_centre"><label for="music_centre"> Music Centre</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="compact_disk"><label for="compact_disk"> Compact Disk</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="live_band"><label for="live_band"> Live Band</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="television_set"><label for="television_set"> Television Set</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="other_devices"><label for="other_devices"> Other (Specify)</label>
                </div>
            </div>
        </div>

        <button class="submit-btn">Generate Control Number</button>
    </div>
</body>
